# Render configuration file
# Deploy with: render deploy

services:
  # API Service
  - type: web
    name: production-manager-api
    env: node
    region: oregon  # or sao-paulo for better latency in Brazil
    buildCommand: ./render-build.sh
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3333
      - key: CORS_ORIGIN
        value: "*"
      # Database - configure in Render dashboard
      - key: DATABASE_URL
        fromDatabase:
          name: production-manager-db
          property: connectionString
      # Omie API - configure in Render dashboard
      - key: OMIE_APP_KEY
        sync: false
      - key: OMIE_APP_SECRET
        sync: false
      - key: OMIE_BASE_URL
        value: https://app.omie.com.br/api/v1/
      # Jobs configuration (optional)
      - key: ENABLE_STOCK_REFRESH_JOB
        value: "true"
      - key: STOCK_REFRESH_CRON
        value: "*/5 * * * *"
      - key: ENABLE_OMIE_PRODUCT_SYNC_JOB
        value: "true"
      - key: OMIE_PRODUCT_SYNC_CRON
        value: "*/30 * * * *"
      - key: OMIE_ORDERS_STAGE_SYNC
        value: "true"
      - key: OMIE_ORDERS_STAGE20_CRON
        value: "*/10 * * * *"

databases:
  # PostgreSQL database
  - name: production-manager-db
    region: oregon  # or sao-paulo
    databaseName: production_manager
    plan: free  # or starter, professional, etc.